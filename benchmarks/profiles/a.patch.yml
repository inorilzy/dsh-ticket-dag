# 坦克基准 A（先合并、最后测，integrationMode end）的 profile 片段。合并进当前 profile 的 dsh-ticket-dag 配置，保留其他字段。
# 集成通道只跑 fast: true 的 fast；soak 推迟到全部工单集成后的最终全量里跑一次。
# 最终全量失败时按合并点二分定位工单并自动追加 fix-<工单>-<n>，最多 maxFinalRepairs 张，超过后运行暂停。
- id: dsh-ticket-dag
  config:
    integrationMode: end
    selectChecksByFiles: false
    maxFinalRepairs: 2
    checkMeta:
      fast:
        files: [src/**, checks/unit/**]
        fast: true
      soak:
        files: [src/**, checks/soak.mjs, checks/harness.mjs]
        fast: false
