# 坦克基准 each（现状，对照组）的 profile 片段。合并进当前 profile 的 dsh-ticket-dag 配置，保留其他字段。
# checkMeta 在 each 下不影响执行，写上是为了和其他方案用同一份元数据（冻结进清单，报告可核对）。
- id: dsh-ticket-dag
  config:
    integrationMode: each
    selectChecksByFiles: false
    checkMeta:
      fast:
        files: [src/**, checks/unit/**]
        fast: true
      soak:
        files: [src/**, checks/soak.mjs, checks/harness.mjs]
        fast: false
